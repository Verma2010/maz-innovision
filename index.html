<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAZ InnoVision - PJ Campus Digital Expo</title>
    <style>
        :root {
            --maz-green: #144324;
            --maz-green-bright: #1e5631;
            --maz-yellow: #fcd116;
            --expo-dark: #070d1e;
            --expo-card: #0e172a;
            --expo-cyan: #00f0ff;
            --expo-purple: #a855f7;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-light);
            background-color: var(--expo-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(30, 86, 49, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.15) 0%, transparent 40%);
            line-height: 1.6;
        }

        /* NAVIGATION BAR */
        nav {
            background-color: rgba(7, 13, 30, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(0, 240, 255, 0.2);
            padding: 12px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-logo {
            height: 42px;
            width: auto;
            object-fit: contain;
        }

        .nav-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .nav-title span {
            color: var(--maz-yellow);
        }

        .nav-tag {
            background: linear-gradient(135deg, var(--maz-green-bright), var(--maz-green));
            color: var(--maz-yellow);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 1px solid var(--maz-yellow);
        }

        /* HERO HEADER */
        header {
            text-align: center;
            padding: 60px 20px 40px 20px;
            position: relative;
        }

        .hero-logo {
            max-width: 200px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.4));
            animation: float 4s ease-in-out infinite;
        }

        header h1 {
            font-size: 3rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(to right, #ffffff, var(--expo-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p.subtitle {
            font-size: 1.2rem;
            color: var(--maz-yellow);
            font-style: italic;
            margin: 10px 0 25px 0;
        }

        /* HIGHLIGHT BADGES BANNER */
        .highlight-banner {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .h-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .h-badge.gold {
            border-color: var(--maz-yellow);
            color: var(--maz-yellow);
            background: rgba(252, 209, 22, 0.08);
            font-weight: 600;
        }

        .h-badge.cyan {
            border-color: var(--expo-cyan);
            color: var(--expo-cyan);
            background: rgba(0, 240, 255, 0.08);
            font-weight: 600;
        }

        .h-badge.purple {
            border-color: var(--expo-purple);
            color: #d8b4fe;
            background: rgba(168, 85, 247, 0.08);
            font-weight: 600;
        }

        /* INTERACTIVE TABS INTERFACE */
        .tab-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .tab-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 10px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .tab-btn.active {
            background: var(--expo-cyan);
            color: #070d1e;
            border-color: var(--expo-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        /* TAB PANELS */
        .tab-panel {
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }

        .tab-panel.active {
            display: block;
        }

        .glass-card {
            background: rgba(14, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 25px;
        }

        .glass-card h2 {
            margin-top: 0;
            color: var(--expo-cyan);
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
        }

        /* GRIDS & TIMELINES */
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .item-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 4px solid var(--expo-purple);
            padding: 22px;
            border-radius: 10px;
            transition: transform 0.2s ease;
        }

        .item-box:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.05);
        }

        .item-box.cyan { border-left-color: var(--expo-cyan); }
        .item-box.gold { border-left-color: var(--maz-yellow); }
        .item-box.green { border-left-color: #22c55e; }

        .item-box h3 {
            margin: 0 0 8px 0;
            font-size: 1.15rem;
            color: #fff;
        }

        .item-box p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* TIMELINE FOR KEY EVENTS */
        .timeline {
            position: relative;
            margin-top: 20px;
            padding-left: 20px;
            border-left: 2px solid rgba(0, 240, 255, 0.3);
        }

        .timeline-event {
            margin-bottom: 25px;
            position: relative;
        }

        .timeline-event::before {
            content: '';
            position: absolute;
            left: -27px;
            top: 4px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--maz-yellow);
            box-shadow: 0 0 8px var(--maz-yellow);
        }

        .timeline-event h4 {
            margin: 0 0 5px 0;
            color: #fff;
            font-size: 1.1rem;
        }

        .timeline-event span {
            font-size: 0.85rem;
            color: var(--expo-cyan);
            font-weight: 600;
        }

        .timeline-event p {
            margin: 5px 0 0 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* SPECIAL MENTIONS CARD */
        .faculty-spotlight {
            background: linear-gradient(135deg, rgba(30, 86, 49, 0.2), rgba(14, 23, 42, 0.9));
            border: 1px solid var(--maz-yellow);
            border-radius: 14px;
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .faculty-icon {
            font-size: 2.5rem;
            background: rgba(252, 209, 22, 0.15);
            padding: 15px;
            border-radius: 50%;
            border: 1px solid var(--maz-yellow);
        }

        /* RESTORED PREMIUM FOOTER */
        footer {
            background-color: #040814;
            color: #94a3b8;
            text-align: center;
            padding: 40px 20px;
            margin-top: 60px;
            border-top: 4px solid var(--maz-yellow);
        }

        footer p {
            margin: 5px 0;
            font-size: 0.95rem;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            header h1 { font-size: 2.2rem; }
            .glass-card { padding: 20px; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-brand">
