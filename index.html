<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAZ InnoVision - PJ Campus Digital Expo</title>
    <style>
:root {--maz-green: #11381f;--maz-green-bright: #1b5e30;--maz-green-light: #2e7d32;--maz-yellow: #fcd116;--maz-yellow-dark: #e6be0d;--bg-body: #f3f5f4;--card-bg: #ffffff;--text-main: #1f2937;--text-muted: #525b67;--border-subtle: #e2e8f0;--accent-blue: #0284c7;}body {font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;margin: 0;padding: 0;background-color: var(--bg-body);background-image:linear-gradient(rgba(17, 56, 31, 0.03) 1px, transparent 1px),linear-gradient(90deg, rgba(17, 56, 31, 0.03) 1px, transparent 1px);background-size: 30px 30px;color: var(--text-main);line-height: 1.7;}.top-bar {background-color: #0b2615;color: #e2e8f0;font-size: 0.85rem;padding: 8px 25px;display: flex;justify-content: space-between;align-items: center;border-bottom: 2px solid var(--maz-yellow);}nav {background-color: #ffffff;padding: 12px 30px;display: flex;justify-content: space-between;align-items: center;box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);position: sticky;top: 0;z-index: 1000;flex-wrap: wrap;gap: 12px;}.nav-brand {display: flex;align-items: center;gap: 12px;}.nav-logo {height: 46px;width: auto;object-fit: contain;}.nav-title-group h2 {margin: 0;font-size: 1.15rem;color: var(--maz-green);font-weight: 700;}.nav-menu {display: flex;gap: 4px;list-style: none;margin: 0;padding: 0;}.nav-link {background: transparent;border: none;padding: 7px 12px;font-weight: 600;font-size: 0.88rem;color: var(--text-muted);cursor: pointer;}footer {background-color: #081a0e;color: #94a3b8;padding: 45px 20px 25px 20px;border-top: 4px solid var(--maz-yellow);margin-top: 60px;}
