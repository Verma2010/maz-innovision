<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAZ InnoVision - PJ Campus Digital Expo</title>
    <style>
        :root {
            --maz-green: #144324;
            --maz-green-bright: #1e5631;
            --maz-yellow: #fcd116;
            --expo-dark: #050b14;
            --expo-card: rgba(13, 22, 41, 0.8);
            --expo-cyan: #00f0ff;
            --expo-purple: #c084fc;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-light);
            background-color: var(--expo-dark);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(30, 86, 49, 0.3) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(0, 240, 255, 0.15) 0%, transparent 45%);
            background-attachment: fixed;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* NAVIGATION BAR */
        nav {
            background-color: rgba(5, 11, 20, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(0, 240, 255, 0.15);
            padding: 12px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-icon-badge {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--maz-green-bright), var(--maz-green));
            border: 1px solid var(--maz-yellow);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .nav-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .nav-title span {
            color: var(--maz-yellow);
        }

        .nav-tag {
            background: rgba(30, 86, 49, 0.4);
            color: var(--maz-yellow);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 1px solid var(--maz-yellow);
        }

        /* HERO HEADER */
        header {
            text-align: center;
            padding: 50px 20px 30px 20px;
        }

        .hero-emblem {
            font-size: 3.5rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.5));
            animation: pulseGlow 3s ease-in-out infinite;
        }

        header h1 {
            font-size: 2.8rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(to right, #ffffff, var(--expo-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p.subtitle {
            font-size: 1.15rem;
            color: var(--maz-yellow);
            font-style: italic;
            margin: 8px 0 25px 0;
        }

        /* HIGHLIGHT PILLS */
        .highlight-banner {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .h-badge {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .h-badge.gold { border-color: var(--maz-yellow); color: var(--maz-yellow); background: rgba(252, 209, 22, 0.06); }
        .h-badge.cyan { border-color: var(--expo-cyan); color: var(--expo-cyan); background: rgba(0, 240, 255, 0.06); }
        .h-badge.purple { border-color: var(--expo-purple); color: var(--expo-purple); background: rgba(192, 132, 252, 0.06); }

        /* TABS INTERFACE */
        .tab-container {
            max-width: 960px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .tab-nav {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.92rem;
            transition: all 0.25s ease;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .tab-btn.active {
            background: var(--expo-cyan);
            color: #050b14;
            border-color: var(--expo-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.35);
        }

        /* PANELS */
        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        .glass-card {
            background: var(--expo-card);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            margin-bottom: 20px;
        }

        .glass-card h2 {
            margin-top: 0;
            color: var(--expo-cyan);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px;
            margin-top: 18px;
        }

        .item-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-left: 4px solid var(--expo-purple);
            padding: 20px;
            border-radius: 10px;
        }

        .item-box.cyan { border-left-color: var(--expo-cyan); }
        .item-box.gold { border-left-color: var(--maz-yellow); }
        .item-box.green { border-left-color: #22c55e; }

        .item-box h3 {
            margin: 0 0 6px 0;
            font-size: 1.1rem;
            color: #fff;
        }

        .item-box p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.92rem;
        }

        /* TIMELINE */
        .timeline {
            position: relative;
            margin-top: 18px;
            padding-left: 18px;
            border-left: 2px solid rgba(0, 240, 255, 0.3);
        }

        .timeline-event {
            margin-bottom: 22px;
            position: relative;
        }

        .timeline-event::before {
            content: '';
            position: absolute;
            left: -25px;
            top: 4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--maz-yellow);
            box-shadow: 0 0 8px var(--maz-yellow);
        }

        .timeline-event h4 { margin: 0 0 4px 0; color: #fff; font-size: 1.05rem; }
        .timeline-event span { font-size: 0.82rem; color: var(--expo-cyan); font-weight: 600; }
        .timeline-event p { margin: 4px 0 0 0; color: var(--text-muted); font-size: 0.92rem; }

        /* MENTORSHIP SPOTLIGHT */
        .faculty-spotlight {
            background: linear-gradient(135deg, rgba(20, 67, 36, 0.3), rgba(13, 22, 41, 0.9));
            border: 1px solid var(--maz-yellow);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 18px;
        }

        .faculty-icon {
            font-size: 2rem;
            background: rgba(252, 209, 22, 0.1);
            padding: 12px;
            border-radius: 50%;
            border: 1px solid var(--maz-yellow);
        }

        /* FOOTER */
        footer {
            background-color: #03060c;
            color: var(--text-muted);
            text-align: center;
            padding: 35px 20px;
            margin-top: 50px;
            border-top: 3px solid var(--maz-yellow);
        }

        footer p { margin: 4px 0; font-size: 0.88rem; }

        @keyframes pulseGlow {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.4)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.7)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.4)); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-brand">
            <div class="nav-icon-badge">🎓</div>
            <div class="nav-title">MAZ <span>InnoVision</span></div>
        </div>
        <div class="nav-tag">PJ Campus</div>
    </nav>

    <header>
        <div class="hero-emblem">💡🌐</div>
        <h1>MAZ <span>InnoVision</span></h1>
        <p class="subtitle">"Where Young Minds Spark Innovation"</p>
        
        <div class="highlight-banner">
